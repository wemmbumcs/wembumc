<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AltarleSMP Web Store</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #040914;
            --card-bg: #0a182b;
            --ocean-blue: #0066ff;
            --electric-cyan: #00f0ff;
            --text-primary: #ffffff;
            --text-secondary: #82a0c8;
            --border-blue: rgba(0, 240, 255, 0.25);
            --red-glow: #ff3355;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 102, 255, 0.3) 0%, transparent 60%),
                radial-gradient(circle at 90% 90%, rgba(0, 240, 255, 0.15) 0%, transparent 50%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            max-width: 800px;
            width: 100%;
            margin-bottom: 35px;
        }

        h1 {
            font-size: 2.8rem;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        h1 span {
            color: var(--electric-cyan);
        }

        /* Player Username Bar */
        .user-input-box {
            background: var(--card-bg);
            border: 2px solid var(--border-blue);
            border-radius: 14px;
            padding: 16px 25px;
            display: inline-flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
        }

        .user-avatar {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            background: #000;
            border: 2px solid var(--electric-cyan);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
            image-rendering: pixelated;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
        }

        .input-group label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .input-group input {
            background: var(--bg-dark);
            border: 1px solid var(--border-blue);
            color: var(--electric-cyan);
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            outline: none;
            transition: all 0.3s;
            width: 200px;
        }

        .input-group input:focus {
            border-color: var(--electric-cyan);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
        }

        /* Section Title */
        .section-title {
            font-size: 1.5rem;
            color: var(--electric-cyan);
            margin: 30px 0 20px 0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Showcase Weapons Section */
        .showcase-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            max-width: 1100px;
            width: 100%;
            margin-bottom: 40px;
        }

        .showcase-card {
            background: rgba(10, 24, 43, 0.8);
            border: 1px solid var(--border-blue);
            border-radius: 12px;
            padding: 20px;
            width: 240px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s ease;
        }

        .showcase-card:hover {
            transform: translateY(-5px);
            border-color: var(--electric-cyan);
            box-shadow: 0 8px 25px rgba(0, 240, 255, 0.25);
        }

        .item-icon {
            width: 110px;
            height: 110px;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.5));
            margin-bottom: 12px;
        }

        .item-icon.red {
            filter: drop-shadow(0 0 12px rgba(255, 51, 85, 0.6));
        }

        .showcase-card h4 {
            font-size: 1.05rem;
            color: #fff;
            margin-bottom: 5px;
        }

        .showcase-card p {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* Packages Grid */
        .store-container {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
            max-width: 1100px;
            width: 100%;
        }

        .card {
            background: var(--card-bg);
            border: 2px solid var(--border-blue);
            border-radius: 16px;
            padding: 32px 25px;
            width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.35s ease;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: var(--electric-cyan);
            box-shadow: 0 12px 35px rgba(0, 102, 255, 0.35);
        }

        .card.featured {
            border-color: var(--electric-cyan);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.25);
        }

        .card.featured:hover {
            box-shadow: 0 12px 40px rgba(0, 240, 255, 0.45);
        }

        .badge {
            position: absolute;
            top: -13px;
            background: linear-gradient(135deg, var(--ocean-blue), var(--electric-cyan));
            color: #040914;
            padding: 4px 16px;
            font-size: 0.75rem;
            font-weight: 800;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 12px rgba(0, 240, 255, 0.4);
        }

        .card-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: #ffffff;
            text-align: center;
        }

        .card.featured .card-title {
            color: var(--electric-cyan);
        }

        .price {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 20px;
            color: #ffffff;
        }

        .price span {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: normal;
        }
