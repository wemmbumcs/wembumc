<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AltarleSMP Web Store</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #030a16;
            --card-bg: #0a172c;
            --ocean-blue: #0077ff;
            --electric-cyan: #00f0ff;
            --deep-blue: #0044aaa3;
            --text-primary: #ffffff;
            --text-secondary: #82a0c8;
            --border-blue: rgba(0, 170, 255, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 119, 255, 0.25) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(0, 240, 255, 0.1) 0%, transparent 50%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 50px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Header Section */
        header {
            text-align: center;
            max-width: 800px;
            width: 100%;
            margin-bottom: 45px;
        }

        h1 {
            font-size: 2.8rem;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(0, 170, 255, 0.6);
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        h1 span {
            color: var(--electric-cyan);
        }

        /* Player Name Input Container */
        .user-input-box {
            background: var(--card-bg);
            border: 2px solid var(--border-blue);
            border-radius: 14px;
            padding: 20px 30px;
            display: inline-flex;
            align-items: center;
            gap: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
        }

        .user-avatar {
            width: 52px;
            height: 52px;
            border-radius: 10px;
            background: #000;
            border: 2px solid var(--electric-cyan);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
            image-rendering: pixelated;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
        }

        .input-group label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .input-group input {
            background: var(--bg-dark);
            border: 1px solid var(--border-blue);
            color: var(--electric-cyan);
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: bold;
            outline: none;
            transition: all 0.3s ease;
            width: 220px;
        }

        .input-group input:focus {
            border-color: var(--electric-cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        /* Store Cards Layout */
        .store-container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            max-width: 1150px;
            width: 100%;
        }

        .card {
            background: var(--card-bg);
            border: 2px solid var(--border-blue);
            border-radius: 18px;
            padding: 35px 28px;
            width: 330px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5);
        }

        .card:hover {
            transform: translateY(-10px);
            border-color: var(--electric-cyan);
            box-shadow: 0 15px 40px rgba(0, 119, 255, 0.35);
        }

        .card.featured {
            border-color: var(--electric-cyan);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.25);
        }

        .card.featured:hover {
            box-shadow: 0 15px 45px rgba(0, 240, 255, 0.45);
        }

        .badge {
            position: absolute;
            top: -14px;
            background: linear-gradient(135deg, var(--ocean-blue), var(--electric-cyan));
            color: #030a16;
            padding: 5px 18px;
            font-size: 0.75rem;
            font-weight: 800;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0, 240, 255, 0.4);
        }

        .card-title {
            font-size: 1.45rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: #ffffff;
            text-align: center;
        }

        .card.featured .card-title {
            color: var(--electric-cyan);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }

        .price {
            font-size: 2.3rem;
            font-weight: 800;
            margin-bottom: 22px;
            color: #ffffff;
        }

        .price span {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: normal;
        }

        .features {
            list-style: none;
            width: 100%;
            margin-bottom: 30px;
            flex-grow: 1;
        }

        .features li {
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            color: #c0d4ed;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .features li i {
            color: var(--electric-cyan);
            font-size: 1.1rem;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #0055ff, var(--ocean-blue));
            color: #ffffff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 85, 255, 0.4);
        }

        .card.featured .btn {
            background: linear-gradient(135deg, var(--ocean-blue), var(--electric-cyan));
            color: #030a16;
            box-shadow: 0 4px 20px rgba(0, 240, 255, 0.4);
        }

        .btn:hover {
            opacity: 0.92;
            transform: scale(1.03);
        }

        /* Toast Notification */
        .cart-toast {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: var(--card-bg);
            border: 2px solid var(--electric-cyan);
            color: #fff;
            padding: 16px 28px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 240, 255, 0.35);
            display: none;
            align-items: center;
            gap: 14px;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <header>
        <h1>AltarleSMP <span>Store</span></h1>
        
        <!-- Player Name Selection -->
        <div class="user-input-box">
            <img id="player-avatar" class="user-avatar" src="https://mc-heads.net/avatar/Niko064255" alt="Skin Head">
            <div class="input-group">
                <label for="username">Minecraft Username</label>
                <input type="text" id="username" value="Niko064255" placeholder="Enter player name...">
            </div>
        </div>
    </header>

    <!-- Packages Grid -->
    <div class="store-container">
        
        <!-- Tier 1 -->
        <div class="card">
            <div class="card-title">altarlesmp plugin</div>
            <div class="price">$19.00 <span>/ Lifetime</span></div>
            <ul class="features">
                <li><i class="fa-solid fa-shield-halved"></i> Custom Armor</li>
            </ul>
            <button class="btn" onclick="addToCart('altarlesmp plugin', 19.00)">Add To Cart</button>
        </div>

        <!-- Tier 2 -->
        <div class="card">
            <div class="card-title">altarlesmp plugin+</div>
            <div class="price">$30.00 <span>/ Lifetime</span></div>
            <ul class="features">
                <li><i class="fa-solid fa-khanda"></i> Custom Weapons</li>
            </ul>
            <button class="btn" onclick="addToCart('altarlesmp plugin+', 30.00)">Add To Cart</button>
        </div>

        <!-- Tier 3 -->
        <div class="card featured">
            <div class="badge">BEST VALUE</div>
            <div class="card-title">altarlesmp plugin++</div>
            <div class="price">$100.00 <span>/ Lifetime</span></div>
            <ul class="features">
                <li><i class="fa-solid fa-shield-halved"></i> Custom Armor</li>
                <li><i class="fa-solid fa-khanda"></i> Custom Weapons</li>
                <li><i class="fa-solid fa-box-open"></i> Texture Pack</li>
            </ul>
            <button class="btn" onclick="addToCart('altarlesmp plugin++', 100.00)">Add To Cart</button>
        </div>

    </div>

    <!-- Added to Cart Toast Notification -->
    <div id="toast" class="cart-toast">
        <i class="fa-solid fa-circle-check" style="color: var(--electric-cyan); font-size: 1.3rem;"></i>
        <span id="toast-message">Added to cart!</span>
    </div>

    <script>
        // Update Minecraft skin head dynamically on username input
        const usernameInput = document.getElementById('username');
        const playerAvatar = document.getElementById('player-avatar');

        usernameInput.addEventListener('input', function () {
            const name = this.value.trim() || 'Steve';
            playerAvatar.src = `https://mc-heads.net/avatar/${name}`;
        });

        // Add package to cart simulation
        function addToCart(packageName, price) {
            const player = usernameInput.value.trim() || 'Steve';
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');

            toastMsg.innerHTML = `Added <b>${packageName}</b> ($${price.toFixed(2)}) for player <b>${player}</b>!`;
            toast.style.display = 'flex';

            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
