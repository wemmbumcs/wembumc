<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AltarleSMP Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: #101826;
            --accent-cyan: #00d2ff;
            --accent-green: #00ffaa;
            --text-main: #ffffff;
            --text-muted: #8a99ad;
            --border-color: rgba(0, 210, 255, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            max-width: 800px;
            width: 100%;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            color: var(--accent-cyan);
            text-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .user-input-box {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        .user-avatar {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            background: #000;
            border: 2px solid var(--accent-cyan);
            image-rendering: pixelated;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 5px;
        }

        .input-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: bold;
        }

        .input-group input {
            background: #090d16;
            border: 1px solid var(--border-color);
            color: var(--accent-green);
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            outline: none;
            transition: all 0.3s;
        }

        .input-group input:focus {
            border-color: var(--accent-green);
            box-shadow: 0 0 10px rgba(0, 255, 170, 0.3);
        }

        .store-container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            max-width: 1100px;
            width: 100%;
        }

        .card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 30px 25px;
            width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s ease;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: var(--accent-cyan);
            box-shadow: 0 12px 35px rgba(0, 210, 255, 0.25);
        }

        .card.featured {
            border-color: var(--accent-green);
            box-shadow: 0 0 25px rgba(0, 255, 170, 0.2);
        }

        .card.featured:hover {
            box-shadow: 0 12px 40px rgba(0, 255, 170, 0.35);
        }

        .badge {
            position: absolute;
            top: -14px;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-cyan));
            color: #090d16;
            padding: 4px 16px;
            font-size: 0.75rem;
            font-weight: 800;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--accent-cyan);
            text-align: center;
        }

        .card.featured .card-title {
            color: var(--accent-green);
        }

        .price {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 20px;
            color: #ffffff;
        }

        .price span {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: normal;
        }

        .features {
            list-style: none;
            width: 100%;
            margin-bottom: 30px;
            flex-grow: 1;
        }

        .features li {
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            color: #d1d8e0;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .features li i {
            color: var(--accent-green);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #00d2ff, #0088ff);
            color: #ffffff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        .card.featured .btn {
            background: linear-gradient(135deg, var(--accent-green), var(--accent-cyan));
            color: #090d16;
        }

        .btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        .cart-toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--card-bg);
            border: 2px solid var(--accent-green);
            color: #fff;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 8px 25px rgba(0, 255, 170, 0.3);
            display: none;
