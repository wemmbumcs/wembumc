<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALTARLESMP STORE</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #040812;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        /* Title */
        .store-title {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .store-title .highlight {
            color: #00f0ff;
        }

        /* Username Box */
        .username-card {
            background-color: #081322;
            border: 1px solid #102a45;
            border-radius: 12px;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 45px;
            width: 360px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .avatar-box {
            width: 48px;
            height: 48px;
            background: #000;
            border-radius: 6px;
            border: 2px solid #00f0ff;
            overflow: hidden;
            flex-shrink: 0;
        }

        .avatar-box img {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        .username-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }

        .username-label {
            font-size: 0.7rem;
            color: #627d9a;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .username-input {
            background-color: #040914;
            border: 1px solid #00f0ff;
            color: #00f0ff;
            font-weight: 700;
            font-size: 0.95rem;
            padding: 8px 12px;
            border-radius: 6px;
            outline: none;
            width: 100%;
        }

        /* Cards Grid */
        .cards-container {
            display: flex;
            gap: 24px;
            justify-content: center;
            align-items: stretch;
            max-width: 1100px;
            width: 100%;
            flex-wrap: wrap;
        }

        .card {
            background-color: #081322;
            border: 1px solid #102a45;
            border-radius: 16px;
            padding: 35px 28px 28px 28px;
            width: 320px;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        /* Featured Card Plugin++ */
        .card.featured {
            border: 2px solid #00f0ff;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.25);
        }

        .badge {
            position: absolute;
            top: -13px;
            left: 50%;
            transform: translateX(-50%);
            background: #00f0ff;
            color: #040812;
            font-size: 0.7rem;
            font-weight: 800;
            padding: 4px 18px;
            border-radius: 20px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .card-name {
            font-size: 1.35rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 16px;
            color: #ffffff;
        }

        .card.featured .card-name {
            color: #00f0ff;
        }

        .card-price {
            font-size: 2.2rem;
            font-weight: 900;
            text-align: center;
            margin-bottom: 20px;
            color: #ffffff;
        }

        .card-price span {
            font-size: 0.85rem;
            color: #627d9a;
            font-weight: 500;
        }

        /* Weapon Preview Container inside Cards */
        .item-previews {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 8px;
            border: 1px dashed rgba(0, 240, 255, 0.2);
        }

        .item-preview-img {
            width: 55px;
            height: 55px;
            object-fit: contain;
            filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.4));
        }

        .item-preview-img.red-sword {
            filter: drop-shadow(0 0 8px rgba(255, 50, 80, 0.5));
        }

        /* Features List */
        .features-list {
            list-style: none;
            margin-bottom: 30px;
            flex-grow: 1;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
            color: #c2d5e8;
            margin-bottom: 14px;
        }

        .feature-item .check {
            color: #00f0ff;
            font-weight: 900;
        }

        /* Add to Cart Buttons */
        .btn-add {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background-color: #0075ff;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-add:hover {
            background-color: #0060d6;
        }

        .card.featured .btn-add {
            background-color: #00f0ff;
            color: #040812;
            font-weight: 800;
        }

        .card.featured .btn-add:hover {
            background-color: #00d6e6;
        }
    </style>
</head>
<body>

    <!-- Header Title -->
    <h1 class="store-title">ALTARLESMP <span class="highlight">STORE</span></h1>

    <!-- Username Card -->
    <div class="username-card">
        <div class="avatar-box">
            <img id="avatar-img" src="https://mc-heads.net/avatar/Niko064255" alt="Skin">
        </div>
        <div class="username-info">
            <span class="username-label">MINECRAFT USERNAME</span>
            <input type="text" id="username-input" class="username-input" value="Niko064255">
        </div>
    </div>

    <!-- Store Packages Grid -->
    <div class="cards-container">

        <!-- Package 1 -->
        <div class="card">
            <h2 class="card-name
